<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tri LTB Admin Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-8 font-sans">
  
  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
    <!-- Header -->
    <div class="bg-gray-900 text-white p-6">
      <h1 class="text-2xl font-bold">Operator Control Center</h1>
      <p class="text-sm text-gray-400">Tri LTB 1v1 Reflex Duel Clash</p>
    </div>

    <div class="p-6">
      
      <!-- Setup Match -->
      <div id="panel-setup" class="mb-8">
        <h2 class="text-xl font-bold mb-4 border-b pb-2">1. Setup Match</h2>
        
        <div class="mb-4">
          <label class="block text-sm font-bold mb-2">Kategori</label>
          <select id="match-category" placeholder="Pilih Kategori...">
            <option value="">Pilih Kategori...</option>
            <option value="SMA">Kategori SMA</option>
            <option value="SMP">Kategori SMP</option>
          </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-bold mb-2">School A (Kicker - Magenta)</label>
            <select id="school-a" placeholder="Pilih Kategori terlebih dahulu" disabled>
              <option value="">Pilih Kategori terlebih dahulu</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-bold mb-2">School B (Goalie - Cyan)</label>
            <select id="school-b" placeholder="Pilih Kategori terlebih dahulu" disabled>
              <option value="">Pilih Kategori terlebih dahulu</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-sm font-bold mb-2">Series City</label>
          <input type="text" id="series-city" placeholder="e.g. Yogyakarta" class="w-full p-2 border rounded" value="Yogyakarta">
        </div>
        
        <button id="btn-publish" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition">
          Publish Session (QR)
        </button>
      </div>
      <!-- Live Match Control -->
      <div id="panel-live" class="mb-8 p-6 bg-gray-50 border rounded-xl hidden">
        <h2 class="text-xl font-bold mb-4">2. Live Match Control</h2>
        <div class="flex items-center justify-between mb-4">
          <div class="text-center">
            <div class="text-sm font-bold text-pink-600" id="live-school-a">School A</div>
            <div class="text-3xl font-black" id="live-taps-a">0</div>
          </div>
          <div class="text-4xl font-bold text-gray-300">VS</div>
          <div class="text-center">
            <div class="text-sm font-bold text-cyan-600" id="live-school-b">School B</div>
            <div class="text-3xl font-black" id="live-taps-b">0</div>
          </div>
        </div>

        <div class="flex gap-4 justify-center mt-8">
          <button id="btn-start-countdown" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-8 rounded shadow">
            Start Countdown (3s)
          </button>
          <button id="btn-stop-battle" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded shadow hidden">
            Force Stop Battle
          </button>
        </div>
      </div>

      <!-- Current State Info -->
      <div class="bg-blue-50 border border-blue-200 text-blue-800 p-4 rounded text-sm">
        <strong>Server State:</strong> <span id="server-state">STATE_ADMIN_SETUP</span>
      </div>

    </div>
  </div>

  <script src="/js/adminControl.js"></script>
</body>
</html>
